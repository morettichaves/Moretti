name: .NET Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore tests/BancoSimples.Tests/BancoSimples.Tests.csproj

      - name: Verify formatting
        run: dotnet format tests/BancoSimples.Tests/BancoSimples.Tests.csproj --verify-no-changes --no-restore

      - name: Build
        run: dotnet build tests/BancoSimples.Tests/BancoSimples.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/BancoSimples.Tests/BancoSimples.Tests.csproj --configuration Release --no-build --collect:"XPlat Code Coverage"
